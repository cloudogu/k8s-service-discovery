global:
  imagePullSecrets:
    - name: "ces-container-registries"
manager:
  image:
    registry: docker.io
    repository: cloudogu/k8s-service-discovery
    tag: 6.0.2
  env:
    logLevel: info
  resources:
    limits:
      memory: 105M
    requests:
      cpu: 15m
      memory: 105M
  replicas: 1
  imagePullPolicy: IfNotPresent
ingress:
  controller: k8s-ces-gateway
networkPolicies:
  enabled: true
  denyAll: true
  ingressControllerAllowedCIDR: "0.0.0.0/0"
loadBalancerService:
  annotations: {}
  internalTrafficPolicy: Cluster
  externalTrafficPolicy: Local

# Configuration for exposing ports and http routes
exposition:
  # Enable exposition of ports via the load balancer
  exposePorts: true
  # Enable port and http route discovery via Services that are annotated (Legacy)
  discoverServices: true
  # Enable port and http route discovery via ExpositionCR
  discoverExpositionCR: true
